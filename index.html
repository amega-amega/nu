function au(){if(AC){AC.resume();return}AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination);
 [[43,'sawtooth',.03],[64.5,'sine',.07],[86,'sine',.04]].forEach(([f,ty,v],i)=>{const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type=ty;o.frequency.value=f;g.gain.value=v;lp.frequency.value=300;

function build(){
 const M=o=>new THREE.MeshStandardMaterial(o),cl=(t,x,y)=>{t=t.clone();t.needsUpdate=true;t.repeat.set(x,y);return t};

 const floorT=tex(512,512,(x,w,h)=>{x.fillStyle='#3a3f46';x.fillRect(0,0,w,h);spk(x,w,h,9000,.25);
  for(let i=0;i<7;i++){const a=R(0,w),b=R(0,h),g=x.createRadialGradient(a,b,0,a,b,R(40,120));g.addColorStop(0,'rgba(8,6,4,.5)');g.addColorStop(1,'rgba(8,6,4,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}
  x.strokeStyle='#14171b';x.lineWidth=4;x.strokeRect(0,0,w,h);x.lineWidth=2;x.beginPath();x.moveTo(w/2,0);x.lineTo(w/2,h);x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke()},4,5);
 const wallT=tex(512,512,(x,w,h)=>{x.fillStyle='#4b535c';x.fillRect(0,0,w,h);spk(x,w,h,8000,.22);
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){const X=i*256,Y=j*256;x.strokeStyle='#20262c';x.lineWidth=5;x.strokeRect(X+3,Y+3,250,250);x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;x.strokeRect(X+8,Y+8,240,240);x.fillStyle='#2b3138';for(const[a,b]of[[16,16],[240,16],[16,240],[240,240]]){x.beginPath();x.arc(X+a,Y+b,5,0,7);x.fill()}}

 const doorT=tex(512,512,(x,w,h)=>{x.fillStyle='#565f69';x.fillRect(0,0,w,h);spk(x,w,h,9000,.25);
